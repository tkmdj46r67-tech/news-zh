<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中国新闻速览 · China News Digest</title>

  <!-- Leaflet, for the province map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Google Fonts: Noto Sans SC for body, ZCOOL XiaoWei for headlines -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">

  <style>
    :root {
      --fg: #1a1a1a;
      --muted: #666;
      --rule: #e5e5e5;
      --accent: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      max-width: 1120px;
      margin: 2rem auto 4rem;
      padding: 0 1.25rem;
      color: var(--fg);
      line-height: 1.6;
      overflow-x: hidden;
    }
    header {
      border-bottom: 3px solid var(--fg);
      padding-bottom: 0.75rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 1.6rem;
      margin: 0 0 0.25rem;
      letter-spacing: -0.01em;
    }
    .meta { font-size: 0.85rem; color: var(--muted); }

    /* ── Two-column layout ─────────────────────────────────── */
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 2rem;
      align-items: start;
    }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static !important; }
    }

    /* ── Story cards ───────────────────────────────────────── */
    .story {
      padding: 1.1rem 0 1.1rem 0.9rem;
      margin-left: -0.9rem;
      border-left: 3px solid transparent;
      border-bottom: 1px solid var(--rule);
      transition: background 0.15s, border-left-color 0.15s;
    }
    .story:last-child { border-bottom: none; }
    .story:hover {
      background: #fafafa;
      border-left-color: var(--accent);
    }
    .category {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }
    .story h2 {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 1.15rem;
      margin: 0 0 0.35rem;
      line-height: 1.35;
    }
    .story h2 a { color: inherit; text-decoration: none; }
    .story h2 a:hover { text-decoration: underline; }
    .subheading { font-size: 0.95rem; color: #444; font-style: italic; margin: 0 0 0.4rem; }
    .first-p { margin: 0; font-size: 0.98rem; }
    .first-p.missing { color: var(--muted); font-style: italic; }

    /* ── Sidebar ───────────────────────────────────────────── */
    .sidebar { position: sticky; top: 1rem; }
    .panel {
      background: #fafafa;
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 0.75rem 0.9rem;
      margin-bottom: 1rem;
    }
    .panel-title {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .clock-date { font-size: 0.85rem; color: var(--muted); }
    .clock-time {
      font-size: 1.35rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }
    .map {
      height: 260px;
      width: 100%;
      background: #fff;
      border-radius: 4px;
      border: 1px solid #eee;
    }
    .map-status {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.55rem;
      min-height: 1.1em;
    }
    .map-status.active { color: var(--accent); font-weight: 600; }

    /* ── Status messages ───────────────────────────────────── */
    .status { padding: 2rem 0; color: var(--muted); text-align: center; }
    .status.error { color: var(--accent); }

    @media (max-width: 480px) {
      h1 { font-size: 1.35rem; }
      .story h2 { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>中国新闻速览</h1>
    <div class="meta" id="meta">正在加载……</div>
  </header>

  <div class="layout">
    <main id="app">
      <div class="status" id="status">正在加载新闻……</div>
    </main>

    <aside class="sidebar">
      <div class="panel">
        <div class="panel-title">北京时间</div>
        <div class="clock-date" id="clock-date">—</div>
        <div class="clock-time" id="clock-time">—</div>
      </div>

      <div class="panel">
        <div class="panel-title">中国地图</div>
        <div id="map" class="map"></div>
        <div class="map-status" id="map-status">悬停文章查看地点</div>
      </div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  // ─────────────────────────────────────────────────────────────
  // 1. Clock — China uses a single timezone (Asia/Shanghai, UTC+8)
  // ─────────────────────────────────────────────────────────────
  const clockDateEl = document.getElementById('clock-date');
  const clockTimeEl = document.getElementById('clock-time');
  const dateFmt = new Intl.DateTimeFormat('zh-CN', {
    timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long',
    day: 'numeric', weekday: 'short'
  });
  const timeFmt = new Intl.DateTimeFormat('zh-CN', {
    timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit',
    second: '2-digit', hour12: false
  });
  function tickClock() {
    const now = new Date();
    clockDateEl.textContent = dateFmt.format(now);
    clockTimeEl.textContent = timeFmt.format(now);
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ─────────────────────────────────────────────────────────────
  // 2. Map + province detection
  // ─────────────────────────────────────────────────────────────
  const GEOJSON_URL = 'china-provinces.json';
  const mapEl = document.getElementById('map');
  const mapStatusEl = document.getElementById('map-status');

  let map = null;
  let geoLayer = null;
  let highlightedLayer = null;
  const nameToLayer = {};

  // Canonical names must match the `properties['地名']` values in
  // china-provinces.json. Aliases are unordered; detection picks the
  // alias whose position in the text is earliest.
  const PROVINCE_ALIASES = [
    ['北京', '北京市'],
    ['天津', '天津市'],
    ['河北', '河北省'], ['石家庄', '河北省'], ['唐山', '河北省'], ['雄安', '河北省'],
    ['山西', '山西省'], ['太原', '山西省'],
    ['内蒙古', '内蒙古自治区'], ['呼和浩特', '内蒙古自治区'],
    ['辽宁', '辽宁省'], ['沈阳', '辽宁省'], ['大连', '辽宁省'],
    ['吉林', '吉林省'], ['长春', '吉林省'],
    ['黑龙江', '黑龙江省'], ['哈尔滨', '黑龙江省'],
    ['上海', '上海市'],
    ['江苏', '江苏省'], ['南京', '江苏省'], ['苏州', '江苏省'], ['无锡', '江苏省'],
    ['浙江', '浙江省'], ['杭州', '浙江省'], ['宁波', '浙江省'],
    ['安徽', '安徽省'], ['合肥', '安徽省'],
    ['福建', '福建省'], ['福州', '福建省'], ['厦门', '福建省'],
    ['江西', '江西省'], ['南昌', '江西省'],
    ['山东', '山东省'], ['济南', '山东省'], ['青岛', '山东省'],
    ['河南', '河南省'], ['郑州', '河南省'],
    ['湖北', '湖北省'], ['武汉', '湖北省'],
    ['湖南', '湖南省'], ['长沙', '湖南省'],
    ['广东', '广东省'], ['广州', '广东省'], ['深圳', '广东省'],
    ['广西', '广西壮族自治区'], ['南宁', '广西壮族自治区'],
    ['海南', '海南省'], ['海口', '海南省'], ['三亚', '海南省'],
    ['重庆', '重庆市'],
    ['四川', '四川省'], ['成都', '四川省'],
    ['贵州', '贵州省'], ['贵阳', '贵州省'],
    ['云南', '云南省'], ['昆明', '云南省'],
    ['西藏', '西藏自治区'], ['拉萨', '西藏自治区'],
    ['陕西', '陕西省'], ['西安', '陕西省'],
    ['甘肃', '甘肃省'], ['兰州', '甘肃省'],
    ['青海', '青海省'], ['西宁', '青海省'],
    ['宁夏', '宁夏回族自治区'], ['银川', '宁夏回族自治区'],
    ['新疆', '新疆维吾尔自治区'], ['乌鲁木齐', '新疆维吾尔自治区'],
    ['台湾', '台湾省'],
    ['香港', '香港特别行政区'],
    ['澳门', '澳门特别行政区'],
  ];

  // Returns the canonical province name of the earliest alias found in text.
  function detectProvince(text) {
    if (!text) return null;
    let bestPos = Infinity;
    let bestName = null;
    for (const [alias, canonical] of PROVINCE_ALIASES) {
      const idx = text.indexOf(alias);
      if (idx !== -1 && idx < bestPos) {
        bestPos = idx;
        bestName = canonical;
      }
    }
    return bestName;
  }

  function highlightProvince(name) {
    if (highlightedLayer && geoLayer) {
      geoLayer.resetStyle(highlightedLayer);
      highlightedLayer = null;
    }
    if (!name) return;
    const layer = nameToLayer[name];
    if (layer) {
      layer.setStyle({
        fillColor: '#b91c1c',
        fillOpacity: 0.75,
        color: '#7f1d1d',
        weight: 0.8,
      });
      layer.bringToFront();
      highlightedLayer = layer;
    }
  }

  function initMap() {
    if (typeof L === 'undefined') {
      mapEl.innerHTML = '<div class="status error">地图组件加载失败</div>';
      return;
    }

    map = L.map(mapEl, {
      zoomControl: false,
      attributionControl: false,
      dragging: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      touchZoom: false,
      boxZoom: false,
      keyboard: false,
    });

    fetch(GEOJSON_URL)
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(geojson => {
        geoLayer = L.geoJSON(geojson, {
          style: { fillColor: '#f0f0f0', color: '#bbb', weight: 0.5, fillOpacity: 1 },
          onEachFeature: (feature, layer) => {
            // cn-atlas stores the Chinese name under 地名, not name
            const n = feature.properties &&
                      (feature.properties['地名'] || feature.properties.name);
            if (n) nameToLayer[n] = layer;
          },
        }).addTo(map);
        map.fitBounds(geoLayer.getBounds(), { padding: [4, 4] });
      })
      .catch(err => {
        mapEl.innerHTML = '<div class="status error">地图数据加载失败</div>';
        console.warn('GeoJSON fetch failed:', err);
      });
  }

  // ─────────────────────────────────────────────────────────────
  // 3. Stories
  // ─────────────────────────────────────────────────────────────
  const CATEGORY_LABELS = {
    'Politics':       '时政',
    'Foreign Policy': '外交',
    'Infrastructure': '基建',
    'Climate':        '气候',
    'Supply Chain':   '供应链',
    'Economy':        '经济',
  };

  const statusEl = document.getElementById('status');
  const metaEl = document.getElementById('meta');
  const appEl = document.getElementById('app');

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function fmtDate(d) {
    if (!d) return '';
    const dt = new Date(d);
    if (isNaN(dt)) return '';
    return dt.toLocaleString('zh-CN', {
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit'
    });
  }

  fetch('data.json?t=' + Date.now())
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(stories => {
      statusEl.remove();

      if (!Array.isArray(stories) || stories.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'status';
        empty.textContent = '暂无新闻数据。';
        appEl.appendChild(empty);
        metaEl.textContent = '未获取到数据';
        return;
      }

      const newest = stories
        .map(s => new Date(s.pubDate))
        .filter(d => !isNaN(d))
        .sort((a, b) => b - a)[0];
      metaEl.textContent =
        `共 ${stories.length} 条 · 最新一条：${newest ? fmtDate(newest) : '—'}`;

      const frag = document.createDocumentFragment();
      stories.forEach(s => {
        const div = document.createElement('article');
        div.className = 'story';

        const catKey = s.category || '';
        const catLabel = CATEGORY_LABELS[catKey] || catKey;
        const sub = s.subheading
          ? `<p class="subheading">${escapeHtml(s.subheading)}</p>` : '';
        const para = s.firstParagraph
          ? `<p class="first-p">${escapeHtml(s.firstParagraph)}</p>`
          : `<p class="first-p missing">（第一段未能提取）</p>`;

        div.innerHTML = `
          ${catLabel ? `<span class="category">${escapeHtml(catLabel)}</span>` : ''}
          <h2><a href="${escapeHtml(s.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(s.title || '(无标题)')}</a></h2>
          ${sub}
          ${para}
        `;

        // Combined text used for location detection.
        div.dataset.searchText =
          [s.title, s.subheading, s.firstParagraph].filter(Boolean).join(' ');

        div.addEventListener('mouseenter', () => {
          const prov = detectProvince(div.dataset.searchText);
          highlightProvince(prov);
          if (prov) {
            mapStatusEl.textContent = '📍 ' + prov;
            mapStatusEl.classList.add('active');
          } else {
            mapStatusEl.textContent = '未检测到地点';
            mapStatusEl.classList.remove('active');
          }
        });
        div.addEventListener('mouseleave', () => {
          highlightProvince(null);
          mapStatusEl.textContent = '悬停文章查看地点';
          mapStatusEl.classList.remove('active');
        });

        frag.appendChild(div);
      });
      appEl.appendChild(frag);
    })
    .catch(err => {
      statusEl.className = 'status error';
      statusEl.textContent = '加载失败：' + err.message +
        '（请确认 data.json 已被 Actions 生成）';
      metaEl.textContent = '加载失败';
    });

  initMap();
  </script>
</body>
</html>
