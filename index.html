<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中国新闻速览 · China News Digest</title>
  <style>
    :root {
      --fg: #1a1a1a;
      --muted: #666;
      --rule: #e5e5e5;
      --accent: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
                   "Microsoft YaHei", sans-serif;
      max-width: 860px;
      margin: 2rem auto 4rem;
      padding: 0 1.25rem;
      color: var(--fg);
      line-height: 1.6;
    }
    header {
      border-bottom: 3px solid var(--fg);
      padding-bottom: 0.75rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 0.25rem;
      letter-spacing: -0.01em;
    }
    .meta {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .story {
      padding: 1.1rem 0;
      border-bottom: 1px solid var(--rule);
    }
    .story:last-child { border-bottom: none; }
    .category {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }
    .story h2 {
      font-size: 1.15rem;
      margin: 0 0 0.35rem;
      line-height: 1.35;
    }
    .story h2 a {
      color: inherit;
      text-decoration: none;
    }
    .story h2 a:hover {
      text-decoration: underline;
    }
    .subheading {
      font-size: 0.95rem;
      color: #444;
      font-style: italic;
      margin: 0 0 0.4rem;
    }
    .first-p {
      margin: 0;
      font-size: 0.98rem;
    }
    .first-p.missing {
      color: var(--muted);
      font-style: italic;
    }
    .status {
      padding: 2rem 0;
      color: var(--muted);
      text-align: center;
    }
    .status.error { color: var(--accent); }
    @media (max-width: 480px) {
      h1 { font-size: 1.35rem; }
      .story h2 { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>中国新闻速览</h1>
    <div class="meta" id="meta">正在加载……</div>
  </header>

  <main id="app">
    <div class="status" id="status">正在加载新闻……</div>
  </main>

  <script>
    const CATEGORY_LABELS = {
      'Politics':        '时政',
      'Foreign Policy':  '外交',
      'Infrastructure':  '基建',
      'Climate':         '气候',
      'Supply Chain':    '供应链',
      'Economy':         '经济',
    };

    const statusEl = document.getElementById('status');
    const metaEl   = document.getElementById('meta');
    const appEl    = document.getElementById('app');

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function fmtDate(d) {
      if (!d) return '';
      const dt = new Date(d);
      if (isNaN(dt)) return '';
      return dt.toLocaleString('zh-CN', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });
    }

    // Cache-buster so a fresh run of the Action shows up immediately
    fetch('data.json?t=' + Date.now())
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(stories => {
        statusEl.remove();

        if (!Array.isArray(stories) || stories.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'status';
          empty.textContent = '暂无新闻数据。';
          appEl.appendChild(empty);
          metaEl.textContent = '未获取到数据';
          return;
        }

        // Header meta: count + freshest timestamp in the set
        const newest = stories
          .map(s => new Date(s.pubDate))
          .filter(d => !isNaN(d))
          .sort((a, b) => b - a)[0];
        metaEl.textContent =
          `共 ${stories.length} 条 · 最新一条：${newest ? fmtDate(newest) : '—'}`;

        const frag = document.createDocumentFragment();
        stories.forEach((s, i) => {
          const div = document.createElement('article');
          div.className = 'story';

          const catKey = s.category || '';
          const catLabel = CATEGORY_LABELS[catKey] || catKey;

          const sub = s.subheading
            ? `<p class="subheading">${escapeHtml(s.subheading)}</p>`
            : '';

          const para = s.firstParagraph
            ? `<p class="first-p">${escapeHtml(s.firstParagraph)}</p>`
            : `<p class="first-p missing">（第一段未能提取）</p>`;

          div.innerHTML = `
            ${catLabel ? `<span class="category">${escapeHtml(catLabel)}</span>` : ''}
            <h2><a href="${escapeHtml(s.link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(s.title || '(无标题)')}</a></h2>
            ${sub}
            ${para}
          `;
          frag.appendChild(div);
        });
        appEl.appendChild(frag);
      })
      .catch(err => {
        statusEl.className = 'status error';
        statusEl.textContent = '加载失败：' + err.message +
          '（请确认 data.json 已被 Actions 生成）';
        metaEl.textContent = '加载失败';
      });
  </script>
</body>
</html>
